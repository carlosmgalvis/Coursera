
<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>
<GridLayout columns="auto, *, auto, auto" verticalAlignment="center">
  <!-- 1. Drawer Button (Leftmost) -->
  <Label col="0" class="fas" text="&#xf0c9;" (tap)="onDrawerButtonTap()" marginRight="15"></Label>
  <!-- 2. Title (Takes up the remaining middle space) -->
  <Label col="1" class="action-bar-title" text="Master"></Label>
  <!-- 3. Favorites Button (To the left of the cart) -->
  <Label col="2" class="fas" text="❤️" (tap)="goToFavorites()" marginRight="15"></Label>
  <!-- 4. Cart Button (Rightmost) -->
  <Label col="3" class="fas" text="🛒" (tap)="goToCart()"></Label>
</GridLayout>
</ActionBar>

<ListView
  height="100%"
  separatorColor="transparent"
  [items]="getFlicks()"
  (itemTap)="onItemTap($event)">

  <ng-template let-item="item" let-i="index">
    <GridLayout
      height="380"
      borderRadius="10"
      class="bg-secondary"
      rows="*, auto, auto, auto"
      columns="*"
      margin="12 10 0 10"
      padding="0"
    >
      <image row="0" margin="0" stretch="aspectFill" [src]="item.image" alt=""></image>

      <label
        row="1"
        margin="10 10 0 10"
        fontWeight="700"
        class="text-primary"
        fontSize="18"
        [text]="item.title"
      ></label>

      <label
        row="2"
        margin="0 10 0 10"
        class="text-secondary"
        fontSize="14"
        textWrap="true"
        [text]="item.description"
      ></label>

     <!-- Price, Favorite and Buy Button Section -->
      <GridLayout row="3" columns="auto, *, auto, auto" margin="10">
        <!-- Favorite Button as GridLayout with tap -->
        <GridLayout col="0" (tap)="onFavoriteTap(item)" width="40" height="40" borderRadius="20" backgroundColor="transparent" marginRight="10">
          <Label class="fas" [text]="item.isFavorite ? '❤️' : '🤍'" fontSize="24" textAlignment="center" verticalAlignment="center" [color]="item.isFavorite ? '#ff4444' : '#999999'"></Label>
        </GridLayout>

        <!-- Price -->
        <label col="1" text="${{ item.ticketPrice.toFixed(2) }}" fontSize="16" fontWeight="700" class="text-primary" verticalAlignment="center"></label>

        <!-- Available tickets badge -->
        <label col="2" text="{{ item.availableTickets }} left" fontSize="12" class="text-secondary" verticalAlignment="center" marginRight="10"></label>

        <!-- Buy button -->
        <GridLayout col="3" (tap)="onBuyTap(item)" backgroundColor="#28a745" borderRadius="5" padding="10 15">
          <Label text="Buy Tickets" color="white" fontSize="14" fontWeight="600" textAlignment="center"></Label>
        </GridLayout>
      </GridLayout>
    </GridLayout>
  </ng-template>
</ListView>
