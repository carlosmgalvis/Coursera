
<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>
  <GridLayout columns="50, *">
    <Label class="action-bar-title" text="Browse" colSpan="2"></Label>
    <Label class="fas" text="&#xf0c9;" (tap)="onDrawerButtonTap()"></Label>
  <ActionItem (tap)="refresh()" ios.position="right" android.position="actionBar">
    <Label text="⟳" class="fas"></Label>
  </ActionItem>
  </GridLayout>
</ActionBar>

<GridLayout rows="auto, *" height="100%">

  <!-- Header with stats -->
  <StackLayout row="0" class="history-header" padding="16">
    <GridLayout columns="*, *">
      <StackLayout col="0" horizontalAlignment="center">
        <Label text="Total Spent" fontSize="12" class="text-secondary"></Label>
        <Label text="${{ totalSales.toFixed(2) }}" fontSize="20" fontWeight="700" color="#28a745"></Label>
      </StackLayout>
      <StackLayout col="1" horizontalAlignment="center">
        <Label text="Transactions" fontSize="12" class="text-secondary"></Label>
        <Label text="{{ totalTransactions }}" fontSize="20" fontWeight="700" class="text-primary"></Label>
      </StackLayout>
    </GridLayout>
  </StackLayout>

  <!-- No purchases message -->
  <StackLayout row="0" rowSpan="2" class="empty-state" visibility="{{ salesHistory.length === 0 ? 'visible' : 'collapsed' }}" verticalAlignment="center" horizontalAlignment="center">
    <Label class="empty-icon" text="🛍️"></Label>
    <Label class="empty-text" text="No purchases yet"></Label>
    <Label class="empty-subtext" text="Your purchase history will appear here"></Label>
  </StackLayout>

  <!-- Sales List -->
  <ListView row="1" [items]="salesHistory" visibility="{{ salesHistory.length > 0 ? 'visible' : 'collapsed' }}" separatorColor="transparent">
    <ng-template let-item="item" let-i="index">
      <GridLayout class="sale-item" rows="auto, auto" columns="*, auto" margin="8 16" padding="12" borderRadius="8" (tap)="viewSaleDetails(item)">

        <StackLayout row="0" col="0">
          <Label text="{{ item.id }}" fontSize="11" class="text-secondary"></Label>
          <Label text="{{ formatDate(item.date) }}" fontSize="14" fontWeight="500" class="text-primary" marginTop="4"></Label>
        </StackLayout>

        <StackLayout row="0" col="1" horizontalAlignment="right">
          <Label text="${{ item.totalAmount.toFixed(2) }}" fontSize="18" fontWeight="700" class="text-primary"></Label>
          <Label text="{{ item.items.length }} item(s)" fontSize="11" class="text-secondary"></Label>
        </StackLayout>

        <FlexboxLayout row="1" col="0" colSpan="2" flexDirection="row" flexWrap="wrap" marginTop="8">
          <Label *ngFor="let cartItem of item.items.slice(0, 2)" text="{{ cartItem.flick.title }} ({{ cartItem.quantity }})" fontSize="11" class="item-badge" marginRight="4" marginTop="4"></Label>
          <Label *ngIf="item.items.length > 2" text="+{{ item.items.length - 2 }} more" fontSize="11" class="item-badge-more" marginTop="4"></Label>
        </FlexboxLayout>

      </GridLayout>
    </ng-template>
  </ListView>

</GridLayout>
