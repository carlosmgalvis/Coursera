<ActionBar [title]="flick?.title">
  <NavigationButton text="Back" android.systemIcon="ic_menu_back" (tap)="goBack()"></NavigationButton>

  <ActionItem (tap)="goToCart()" ios.position="right" android.position="actionBar">
    <Label text="🛒" class="fas"></Label>
  </ActionItem>
</ActionBar>

<ScrollView height="100%">
  <StackLayout>
    <image margin="0" stretch="aspectFill" alt="" [src]="flick?.image"></image>

    <!-- Favorite, Price and Buy Button Section -->
    <GridLayout columns="auto, *, auto" padding="10 20" backgroundColor="#f8f9fa" marginTop="10">
      <!-- Favorite Button -->
      <GridLayout col="0" (tap)="onFavoriteTap()" width="50" height="50" borderRadius="25" backgroundColor="transparent" marginRight="15">
        <Label class="fas" [text]="flick?.isFavorite ? '❤️' : '🤍'" fontSize="28" textAlignment="center" verticalAlignment="center" [color]="flick?.isFavorite ? '#ff4444' : '#999999'"></Label>
      </GridLayout>

      <StackLayout col="1">
        <label text="Ticket Price" fontSize="12" class="text-secondary"></label>
        <label text="${{ flick?.ticketPrice?.toFixed(2) }}" fontSize="24" fontWeight="700" class="text-primary"></label>
        <label text="{{ flick?.availableTickets }} tickets available" fontSize="12" class="text-secondary"></label>
      </StackLayout>

      <GridLayout col="2" (tap)="addToCart()" backgroundColor="#28a745" borderRadius="8" padding="12 20" verticalAlignment="center">
        <Label text="Add to Cart" color="white" fontSize="16" fontWeight="600" textAlignment="center"></Label>
      </GridLayout>
    </GridLayout>

    @for (detail of flick?.details; track $index) {
    <StackLayout padding="10 20">
      <label
        marginTop="15"
        fontSize="16"
        fontWeight="700"
        class="text-primary"
        textWrap="true"
        [text]="detail.title"
      ></label>
      <label
        fontSize="14"
        class="text-secondary"
        textWrap="true"
        [text]="detail.body"
      ></label>
    </StackLayout>
    }
  </StackLayout>
</ScrollView>
