<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>
  <GridLayout columns="50, *">
    <Label class="fas" text="&#xf0c9;" (tap)="onDrawerButtonTap()"></Label>
    <Label class="action-bar-title" text="Google Maps" col="1"></Label>
  </GridLayout>
</ActionBar>

<ScrollView class="page__content">
  <StackLayout class="form-container">
    <Label text="Configuración de Google Maps" class="h1 mb-2" textWrap="true"></Label>
    
    <TextField 
      hint="Ingresa tu API Key de Google Maps..." 
      class="input mb-2"
      [(ngModel)]="apiKey"
      (blur)="setApiKey(apiKey)">
    </TextField>

    <Label [text]="'API Key configurada: ' + apiKey" class="api-key-display mb-4" textWrap="true"></Label>

    <Label text="Mapa con Marker" class="h1 mb-2" textWrap="true"></Label>
    
    <GridLayout height="300" class="map-container">
      <Label text="Google Maps se mostrará aquí" 
             class="map-placeholder"
             horizontalAlignment="center"
             verticalAlignment="middle">
      </Label>
    </GridLayout>

    <Label [text]="'Latitud: ' + latitude" class="coordinate-label"></Label>
    <Label [text]="'Longitud: ' + longitude" class="coordinate-label"></Label>
    <Label [text]="'Zoom: ' + zoom" class="coordinate-label"></Label>
    <Label text="Marker personalizado en Sydney, Australia" class="marker-info"></Label>
  </StackLayout>
</ScrollView>
