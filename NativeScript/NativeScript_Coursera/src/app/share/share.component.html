<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>
  <GridLayout columns="50, *">
    <Label class="fas" text="&#xf0c9;" (tap)="onDrawerButtonTap()"></Label>
    <Label class="action-bar-title" text="Compartir" col="1"></Label>
  </GridLayout>
</ActionBar>

<ScrollView class="page__content">
  <StackLayout class="form-container">
    <Label text="Compartir Texto" class="h1 mb-2" textWrap="true"></Label>
    
    <TextField 
      hint="Escribe el texto a compartir..." 
      class="input"
      [(ngModel)]="textToShare"
      textWrap="true"
      height="100">
    </TextField>

    <Button text="Compartir Texto" 
            class="btn btn-primary mb-4"
            (tap)="shareText()">
    </Button>

    <Divider class="my-4"/>

    <Label text="Cámara y Compartir Imagen" class="h1 mb-2" textWrap="true"></Label>
    
    <Button text="Tomar Foto" 
            class="btn btn-secondary mb-2"
            (tap)="takePicture()">
    </Button>

    <Image 
      *ngIf="hasImage"
      [src]="capturedImagePath"
      class="captured-image mb-2"
      stretch="aspectFit"
      horizontalAlignment="center">
    </Image>

    <Button text="Compartir Imagen" 
            class="btn btn-primary mb-2"
            [enabled]="hasImage"
            (tap)="shareImage()">
    </Button>

    <Button text="Compartir Texto + Imagen" 
            class="btn btn-secondary"
            [enabled]="hasImage && textToShare"
            (tap)="shareTextAndImage()">
    </Button>
  </StackLayout>
</ScrollView>
