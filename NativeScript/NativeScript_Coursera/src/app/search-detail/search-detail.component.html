<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>
  <GridLayout columns="50, *">
    <Label class="fas" text="&#xf0c9;" (tap)="onDrawerButtonTap()"></Label>
    <Label class="action-bar-title" [text]="item?.title || 'Detalle'" col="1"></Label>
  </GridLayout>
</ActionBar>

<GridLayout class="page__content">
  <StackLayout class="detail-container" *ngIf="item">
    <!-- Ícono con animación de rotación -->
    <FlexboxLayout justifyContent="center" class="icon-container">
      <Label 
        class="fas product-icon"
        text="&#xf02e;"
        [rotate]="rotationAngle"
        (tap)="onRotateIcon()">
      </Label>
    </FlexboxLayout>

    <Label [text]="item.title" class="product-title"></Label>
    
    <FlexboxLayout class="info-row">
      <Label [text]="item.category" class="category-badge"></Label>
      <Label [text]="'★ ' + item.rating" class="rating"></Label>
    </FlexboxLayout>

    <Label [text]="'$' + item.price" class="product-price"></Label>
    
    <Label [text]="item.description" class="product-description" textWrap="true"></Label>

    <Button text="← Volver al listado" class="back-button" (tap)="onBackTap()"></Button>
  </StackLayout>
</GridLayout>
