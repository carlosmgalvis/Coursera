  <ActionBar class="action-bar">
    <GridLayout columns="50, *, auto">
    <Label class="fas" col="0" text="&#xf0c9;" (tap)="onDrawerButtonTap()"></Label>
    <Label class="action-bar-title" col="1" text="Analytics Dashboard"></Label>
  <ActionItem (tap)="refresh()" ios.position="right" android.position="actionBar">
    <Label text="⟳" class="fas"></Label>
  </ActionItem>
  </GridLayout>
</ActionBar>




<GridLayout rows="auto, auto, *" height="100%">

  <!-- Loading indicator -->
  <StackLayout row="0" rowSpan="3" *ngIf="isLoading" verticalAlignment="center" horizontalAlignment="center">
    <ActivityIndicator busy="true" width="50" height="50"></ActivityIndicator>
    <Label text="Loading analytics..." marginTop="10" class="text-secondary"></Label>
  </StackLayout>

  <StackLayout *ngIf="!isLoading">

    <!-- Period Selector -->
    <GridLayout row="0" columns="*, *, *" padding="10" backgroundColor="#f8f9fa">
      <GridLayout col="0" (tap)="changePeriod('day')" backgroundColor="{{ selectedPeriod === 'day' ? '#007aff20' : 'transparent' }}" borderRadius="8" padding="10" margin="4">
        <Label text="Day" textAlignment="center" fontSize="14" color="{{ selectedPeriod === 'day' ? '#007aff' : '#666' }}" fontWeight="{{ selectedPeriod === 'day' ? '600' : 'normal' }}"></Label>
      </GridLayout>
      <GridLayout col="1" (tap)="changePeriod('week')" backgroundColor="{{ selectedPeriod === 'week' ? '#007aff20' : 'transparent' }}" borderRadius="8" padding="10" margin="4">
        <Label text="Week" textAlignment="center" fontSize="14" color="{{ selectedPeriod === 'week' ? '#007aff' : '#666' }}" fontWeight="{{ selectedPeriod === 'week' ? '600' : 'normal' }}"></Label>
      </GridLayout>
      <GridLayout col="2" (tap)="changePeriod('month')" backgroundColor="{{ selectedPeriod === 'month' ? '#007aff20' : 'transparent' }}" borderRadius="8" padding="10" margin="4">
        <Label text="Month" textAlignment="center" fontSize="14" color="{{ selectedPeriod === 'month' ? '#007aff' : '#666' }}" fontWeight="{{ selectedPeriod === 'month' ? '600' : 'normal' }}"></Label>
      </GridLayout>
    </GridLayout>

    <!-- Date Navigation -->
    <GridLayout row="1" columns="auto, *, auto" padding="10" backgroundColor="white">
      <GridLayout col="0" (tap)="goBack()" width="40" height="40" borderRadius="20" backgroundColor="#f0f0f0" horizontalAlignment="center" verticalAlignment="center">
        <Label text="◀" fontSize="16" color="#007aff"></Label>
      </GridLayout>
      <Label col="1" text="{{ dateRangeLabel }}" fontSize="16" fontWeight="600" class="text-primary" textAlignment="center" verticalAlignment="center"></Label>
      <GridLayout col="2" (tap)="goForward()" width="40" height="40" borderRadius="20" backgroundColor="#f0f0f0" horizontalAlignment="center" verticalAlignment="center">
        <Label text="▶" fontSize="16" color="#007aff"></Label>
      </GridLayout>
    </GridLayout>

    <ScrollView row="2">
      <StackLayout class="analytics-container" padding="10">

        <!-- No Data Message -->
        <StackLayout *ngIf="getTotalTransactions() === 0" class="empty-state" padding="40" textAlignment="center">
          <Label text="📊" fontSize="64" opacity="0.5" textAlignment="center"></Label>
          <Label text="No sales data for this period" fontSize="16" fontWeight="600" color="#495057" textAlignment="center" marginTop="10"></Label>
          <Label text="Make some purchases to see analytics" fontSize="13" color="#adb5bd" textAlignment="center" marginTop="5"></Label>
        </StackLayout>

        <!-- Summary Cards -->
        <GridLayout *ngIf="getTotalTransactions() > 0" columns="*, *" margin="5">
          <StackLayout col="0" class="summary-card" backgroundColor="white" borderRadius="12" padding="15" margin="5" elevation="2">
            <Label text="Total Spent" fontSize="11" class="text-secondary"></Label>
            <Label text="{{ formatCurrency(getTotalSpent()) }}" fontSize="20" fontWeight="700" color="#28a745" marginTop="5"></Label>
          </StackLayout>
          <StackLayout col="1" class="summary-card" backgroundColor="white" borderRadius="12" padding="15" margin="5" elevation="2">
            <Label text="Total Tickets" fontSize="11" class="text-secondary"></Label>
            <Label text="{{ formatNumber(getTotalTickets()) }}" fontSize="20" fontWeight="700" class="text-primary" marginTop="5"></Label>
          </StackLayout>
        </GridLayout>

        <GridLayout *ngIf="getTotalTransactions() > 0" columns="*, *" margin="5">
          <StackLayout col="0" class="summary-card" backgroundColor="white" borderRadius="12" padding="15" margin="5" elevation="2">
            <Label text="Transactions" fontSize="11" class="text-secondary"></Label>
            <Label text="{{ formatNumber(getTotalTransactions()) }}" fontSize="18" fontWeight="700" class="text-primary" marginTop="5"></Label>
          </StackLayout>
          <StackLayout col="1" class="summary-card" backgroundColor="white" borderRadius="12" padding="15" margin="5" elevation="2">
            <Label text="Avg. Transaction" fontSize="11" class="text-secondary"></Label>
            <Label text="{{ formatCurrency(getAverageTransaction()) }}" fontSize="16" fontWeight="600" class="text-primary" marginTop="5"></Label>
          </StackLayout>
        </GridLayout>

        <!-- Top Shows -->
        <StackLayout *ngIf="getTopShows().length > 0" class="section" backgroundColor="white" margin="10" padding="15" borderRadius="12" elevation="2">
          <Label text="Top Shows" fontSize="18" fontWeight="700" class="text-primary" marginBottom="15"></Label>

          <StackLayout *ngFor="let show of getTopShows()" marginBottom="15">
            <GridLayout columns="*, auto">
              <StackLayout col="0">
                <Label [text]="show.showTitle" fontSize="14" fontWeight="600" class="text-primary" textWrap="true"></Label>
                <Label text="{{ show.totalTickets }} tickets" fontSize="11" class="text-secondary"></Label>
              </StackLayout>
              <StackLayout col="1" horizontalAlignment="right">
                <Label text="{{ formatCurrency(show.totalSales) }}" fontSize="14" fontWeight="600" class="text-primary"></Label>
                <Label text="{{ show.timesPurchased }} purchases" fontSize="11" class="text-secondary"></Label>
              </StackLayout>
            </GridLayout>
            <Progress [value]="(show.totalSales / getTotalSpent()) * 100" maxValue="100" backgroundColor="#e0e0e0" color="#28a745" height="4" marginTop="8"></Progress>
          </StackLayout>
        </StackLayout>

        <!-- Sales Overview -->
        <StackLayout *ngIf="getPeriodData().length > 0" class="section" backgroundColor="white" margin="10" padding="15" borderRadius="12" elevation="2">
          <Label text="Sales Overview" fontSize="18" fontWeight="700" class="text-primary" marginBottom="15"></Label>

          <StackLayout *ngFor="let period of getPeriodData()" marginBottom="15">
            <GridLayout columns="*, auto">
              <Label col="0" [text]="period.period" fontSize="14" class="text-primary"></Label>
              <Label col="1" text="{{ formatCurrency(period.totalSales) }}" fontSize="14" fontWeight="600" class="text-primary"></Label>
            </GridLayout>
            <GridLayout columns="*, auto" marginTop="4">
              <Label col="0" text="{{ period.transactionCount }} transactions" fontSize="11" class="text-secondary"></Label>
              <Label col="1" text="{{ period.totalTickets }} tickets" fontSize="11" class="text-secondary"></Label>
            </GridLayout>
            <Progress [value]="(period.totalSales / getTotalSpent()) * 100" maxValue="100" backgroundColor="#e0e0e0" color="#007aff" height="4" marginTop="8"></Progress>
          </StackLayout>
        </StackLayout>

      </StackLayout>
    </ScrollView>
  </StackLayout>
</GridLayout>
