<ActionBar title="Purchase History" class="action-bar">
  <NavigationButton text="Back"></NavigationButton>
  <ActionItem (tap)="goToMaster()" ios.position="right" android.position="actionBar">
    <Label text="🏠" class="fas"></Label>
  </ActionItem>
</ActionBar>

<GridLayout rows="auto, *" height="100%">

  <!-- Loading indicator -->
  <StackLayout row="0" rowSpan="2" *ngIf="isLoading" verticalAlignment="center" horizontalAlignment="center">
    <ActivityIndicator busy="true" width="50" height="50"></ActivityIndicator>
    <Label text="Loading..." marginTop="10"></Label>
  </StackLayout>

  <!-- Header with stats -->
  <StackLayout row="0" class="history-header" padding="16" backgroundColor="#f8f9fa" *ngIf="!isLoading">
    <GridLayout columns="*, *">
      <StackLayout col="0" horizontalAlignment="center">
        <Label text="Total Spent" fontSize="12" class="text-secondary"></Label>
        <Label text="${{ totalSales.toFixed(2) }}" fontSize="20" fontWeight="700" color="#28a745"></Label>
      </StackLayout>
      <StackLayout col="1" horizontalAlignment="center">
        <Label text="Tickets Purchased" fontSize="12" class="text-secondary"></Label>
        <Label text="{{ totalTickets }}" fontSize="20" fontWeight="700" class="text-primary"></Label>
      </StackLayout>
    </GridLayout>
  </StackLayout>

  <!-- No purchases message -->
  <StackLayout row="0" rowSpan="2" class="empty-state" *ngIf="!isLoading && salesHistory.length === 0" verticalAlignment="center" horizontalAlignment="center">
    <Label text="🎫" fontSize="64" opacity="0.5"></Label>
    <Label text="No purchases yet" fontSize="18" fontWeight="600" color="#495057" marginTop="10"></Label>
    <Label text="Your purchase history will appear here" fontSize="14" color="#adb5bd" marginTop="5"></Label>
    <GridLayout (tap)="goToMaster()" backgroundColor="#007aff" borderRadius="8" padding="12 24" marginTop="20">
      <Label text="Browse Shows" color="white" fontSize="14" fontWeight="600"></Label>
    </GridLayout>
  </StackLayout>

  <!-- Sales List -->
  <ListView row="1" [items]="salesHistory" *ngIf="!isLoading && salesHistory.length > 0" separatorColor="transparent">
    <ng-template let-item="item" let-i="index">
      <GridLayout class="sale-item" rows="auto, auto" columns="*, auto" margin="8 16" padding="12" borderRadius="8" backgroundColor="white" (tap)="viewSaleDetails(item)">

        <StackLayout row="0" col="0">
          <Label [text]="item.showTitle" fontSize="16" fontWeight="600" class="text-primary"></Label>
          <Label text="{{ formatShortDate(item.scheduleDateTime) }}" fontSize="12" class="text-secondary" marginTop="4"></Label>
        </StackLayout>

        <StackLayout row="0" col="1" horizontalAlignment="right">
          <Label text="${{ item.totalAmount.toFixed(2) }}" fontSize="18" fontWeight="700" class="text-primary"></Label>
          <Label text="{{ item.quantity }} ticket(s)" fontSize="11" class="text-secondary"></Label>
        </StackLayout>

        <StackLayout row="1" col="0" colSpan="2" marginTop="8">
          <Label text="Purchased: {{ formatDate(item.saleDate) }}" fontSize="11" class="text-secondary"></Label>
        </StackLayout>

      </GridLayout>
    </ng-template>
  </ListView>

</GridLayout>
