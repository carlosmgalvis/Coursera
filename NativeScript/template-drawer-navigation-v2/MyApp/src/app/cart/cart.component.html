<ActionBar title="Shopping Cart" class="action-bar">
  <NavigationButton text="Back" android.systemIcon="ic_menu_back" (tap)="continueShopping()"></NavigationButton>
  <ActionItem (tap)="goToMaster()" ios.position="right" android.position="actionBar">
    <Label text="🏠" class="fas"></Label>
  </ActionItem>
</ActionBar>

<GridLayout rows="auto, *, auto" height="100%">

  <StackLayout row="0" class="cart-summary" visibility="{{ cartItems.length > 0 ? 'visible' : 'collapsed' }}" backgroundColor="#f8f9fa" padding="16">
    <Label text="🛒 Your Cart" fontSize="18" fontWeight="600" color="#212529"></Label>
    <Label text="{{ totalItems }} item(s)" fontSize="14" color="#6c757d" marginTop="4"></Label>
  </StackLayout>

  <!-- Empty Cart -->
  <StackLayout row="0" rowSpan="2" class="empty-cart" visibility="{{ cartItems.length === 0 ? 'visible' : 'collapsed' }}" verticalAlignment="center" horizontalAlignment="center">
    <Label text="🛒" fontSize="64" opacity="0.5"></Label>
    <Label text="Your cart is empty" fontSize="18" fontWeight="600" color="#495057" marginTop="10"></Label>
    <Label text="Add some tickets to get started" fontSize="14" color="#adb5bd" marginTop="5"></Label>
    <GridLayout (tap)="continueShopping()" backgroundColor="#007aff" borderRadius="8" padding="12 24" marginTop="20">
      <Label text="Browse Shows" color="white" fontSize="14" fontWeight="600"></Label>
    </GridLayout>
  </StackLayout>

  <!-- Cart Items List -->
  <ListView row="1" [items]="cartItems" visibility="{{ cartItems.length > 0 ? 'visible' : 'collapsed' }}" separatorColor="transparent">
    <ng-template let-item="item" let-i="index">
      <GridLayout class="cart-item" rows="auto, auto" columns="auto, *, auto" margin="8 16" padding="12" borderRadius="8" backgroundColor="white">

        <image row="0" alt="" rowSpan="2" col="0" width="60" height="60" borderRadius="4" stretch="aspectFill" [src]="item.flick.image" backgroundColor="#f8f9fa"></image>

        <StackLayout row="0" col="1" marginLeft="12">
          <Label [text]="item.flick.title" fontSize="16" fontWeight="700" class="text-primary"></Label>
          <Label text="${{ item.flick.ticketPrice.toFixed(2) }} each" fontSize="12" class="text-secondary"></Label>
          <Label [text]="formatDate(item.scheduleDateTime)" fontSize="11" class="text-secondary" marginTop="4"></Label>
        </StackLayout>

        <GridLayout col="2" (tap)="removeItem(item)" width="32" height="32" borderRadius="16" backgroundColor="transparent" horizontalAlignment="right">
          <Label text="✕" fontSize="18" color="#dc3545" textAlignment="center" verticalAlignment="center"></Label>
        </GridLayout>

        <GridLayout row="1" col="1" columns="auto, auto, auto" marginTop="8" marginLeft="12" horizontalAlignment="left">
          <GridLayout col="0" (tap)="updateQuantity(item, -1)" width="32" height="32" borderRadius="16" backgroundColor="#f8f9fa" horizontalAlignment="center" verticalAlignment="center">
            <Label text="-" fontSize="18" color="#007aff"></Label>
          </GridLayout>
          <Label col="1" [text]="item.quantity" fontSize="16" fontWeight="600" minWidth="30" textAlignment="center" marginLeft="8" marginRight="8" verticalAlignment="center"></Label>
          <GridLayout col="2" (tap)="updateQuantity(item, 1)" width="32" height="32" borderRadius="16" backgroundColor="#f8f9fa" horizontalAlignment="center" verticalAlignment="center">
            <Label text="+" fontSize="18" color="#007aff"></Label>
          </GridLayout>
        </GridLayout>

        <StackLayout row="1" col="2" verticalAlignment="bottom" horizontalAlignment="right">
          <Label text="Subtotal:" fontSize="11" class="text-secondary"></Label>
          <Label text="${{ item.subtotal.toFixed(2) }}" fontSize="16" fontWeight="700" class="text-primary"></Label>
        </StackLayout>

      </GridLayout>
    </ng-template>
  </ListView>

  <!-- Checkout Footer -->
  <GridLayout row="2" class="checkout-footer" visibility="{{ cartItems.length > 0 ? 'visible' : 'collapsed' }}" columns="*, auto" padding="16" backgroundColor="white" borderTopWidth="1" borderTopColor="#dee2e6">
    <StackLayout col="0">
      <Label text="Total" fontSize="14" class="text-secondary"></Label>
      <Label text="${{ totalPrice.toFixed(2) }}" fontSize="24" fontWeight="700" class="text-primary"></Label>
    </StackLayout>
    <GridLayout col="1" (tap)="checkout()" backgroundColor="#28a745" borderRadius="8" padding="12 24" verticalAlignment="center">
      <Label text="Checkout" color="white" fontSize="16" fontWeight="600"></Label>
    </GridLayout>
  </GridLayout>

</GridLayout>
