<ActionBar title="General Information" class="action-bar">
  <NavigationButton text="Back" android.systemIcon="ic_menu_back" (tap)="goBack()"></NavigationButton>
</ActionBar>

<ScrollView>
  <StackLayout class="info-container" padding="20">

    <StackLayout class="info-card" backgroundColor="white" borderRadius="12" padding="20" marginBottom="15" elevation="2">
      <Label text="Account Information" fontSize="18" fontWeight="700" color="#007aff" marginBottom="15"></Label>

      <GridLayout columns="auto, *" marginBottom="12">
        <Label col="0" text="📧" fontSize="16" marginRight="10" verticalAlignment="center"></Label>
        <StackLayout col="1">
          <Label text="Email" fontSize="12" color="#666"></Label>
          <Label [text]="user.email || 'Not set'" fontSize="15" color="#333" marginTop="2"></Label>
        </StackLayout>
      </GridLayout>

      <GridLayout columns="auto, *" marginBottom="12">
        <Label col="0" text="👤" fontSize="16" marginRight="10" verticalAlignment="center"></Label>
        <StackLayout col="1">
          <Label text="Name" fontSize="12" color="#666"></Label>
          <Label [text]="user.name || 'Not set'" fontSize="15" color="#333" marginTop="2"></Label>
        </StackLayout>
      </GridLayout>

      <GridLayout columns="auto, *" marginBottom="12">
        <Label col="0" text="📱" fontSize="16" marginRight="10" verticalAlignment="center"></Label>
        <StackLayout col="1">
          <Label text="Phone" fontSize="12" color="#666"></Label>
          <Label [text]="user.phone || 'Not set'" fontSize="15" color="#333" marginTop="2"></Label>
        </StackLayout>
      </GridLayout>

      <GridLayout columns="auto, *" marginBottom="12">
        <Label col="0" text="🆔" fontSize="16" marginRight="10" verticalAlignment="center"></Label>
        <StackLayout col="1">
          <Label text="User ID" fontSize="12" color="#666"></Label>
          <Label [text]="user.id || 'Not set'" fontSize="15" color="#333" marginTop="2"></Label>
        </StackLayout>
      </GridLayout>
    </StackLayout>

    <StackLayout class="info-card" backgroundColor="white" borderRadius="12" padding="20" marginBottom="15" elevation="2">
      <Label text="App Information" fontSize="18" fontWeight="700" color="#007aff" marginBottom="15"></Label>

      <GridLayout columns="auto, *" marginBottom="12">
        <Label col="0" text="📱" fontSize="16" marginRight="10" verticalAlignment="center"></Label>
        <StackLayout col="1">
          <Label text="App Version" fontSize="12" color="#666"></Label>
          <Label text="1.0.0" fontSize="15" color="#333" marginTop="2"></Label>
        </StackLayout>
      </GridLayout>

      <GridLayout columns="auto, *" marginBottom="12">
        <Label col="0" text="🤖" fontSize="16" marginRight="10" verticalAlignment="center"></Label>
        <StackLayout col="1">
          <Label text="Platform" fontSize="12" color="#666"></Label>
          <Label text="NativeScript" fontSize="15" color="#333" marginTop="2"></Label>
        </StackLayout>
      </GridLayout>
    </StackLayout>

  </StackLayout>
</ScrollView>
