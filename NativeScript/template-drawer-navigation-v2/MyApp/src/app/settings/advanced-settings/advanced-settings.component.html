<ActionBar title="Advanced Settings" class="action-bar">
  <NavigationButton text="Back" android.systemIcon="ic_menu_back" (tap)="goBack()"></NavigationButton>
</ActionBar>

<ScrollView>
  <StackLayout class="advanced-container" padding="20">

    <Label text="API Configuration" fontSize="18" fontWeight="700" color="#007aff" marginBottom="15"></Label>

    <!-- Base URL -->
    <StackLayout class="config-section" marginBottom="16" backgroundColor="white" borderRadius="12" padding="16" elevation="2" (tap)="editApiBaseUrl()">
      <Label text="Base URL" fontSize="12" color="#666" marginBottom="4"></Label>
      <GridLayout columns="*, auto">
        <Label col="0" [text]="apiConfig.baseUrl" fontSize="13" color="#333" textWrap="true"></Label>
        <Label col="1" text="✏️" fontSize="16" color="#007aff"></Label>
      </GridLayout>
    </StackLayout>

    <!-- Port -->
    <StackLayout class="config-section" marginBottom="16" backgroundColor="white" borderRadius="12" padding="16" elevation="2" (tap)="editApiPort()">
      <Label text="Port" fontSize="12" color="#666" marginBottom="4"></Label>
      <GridLayout columns="*, auto">
        <Label col="0" [text]="apiConfig.port" fontSize="15" color="#333"></Label>
        <Label col="1" text="✏️" fontSize="16" color="#007aff"></Label>
      </GridLayout>
    </StackLayout>

    <!-- Timeout -->
    <StackLayout class="config-section" marginBottom="16" backgroundColor="white" borderRadius="12" padding="16" elevation="2" (tap)="editApiTimeout()">
      <Label text="Request Timeout (ms)" fontSize="12" color="#666" marginBottom="4"></Label>
      <GridLayout columns="*, auto">
        <Label col="0" [text]="apiConfig.timeout + ' ms'" fontSize="15" color="#333"></Label>
        <Label col="1" text="✏️" fontSize="16" color="#007aff"></Label>
      </GridLayout>
    </StackLayout>

    <!-- Retry Attempts -->
    <StackLayout class="config-section" marginBottom="16" backgroundColor="white" borderRadius="12" padding="16" elevation="2" (tap)="editApiRetryAttempts()">
      <Label text="Retry Attempts" fontSize="12" color="#666" marginBottom="4"></Label>
      <GridLayout columns="*, auto">
        <Label col="0" [text]="apiConfig.retryAttempts" fontSize="15" color="#333"></Label>
        <Label col="1" text="✏️" fontSize="16" color="#007aff"></Label>
      </GridLayout>
    </StackLayout>

    <!-- Current API URL Preview -->
    <StackLayout class="preview-box" marginTop="10" padding="16" backgroundColor="#e7f1ff" borderRadius="12" marginBottom="20">
      <Label text="Current API Endpoint" fontSize="11" color="#666"></Label>
      <Label text="{{ getFullApiUrl() }}" fontSize="12" color="#007aff" textWrap="true" marginTop="4"></Label>
    </StackLayout>

    <!-- API Action Buttons -->
    <GridLayout columns="*, *" marginBottom="20">
      <GridLayout col="0" (tap)="testApiConnection()" backgroundColor="#007aff" borderRadius="8" padding="12" marginRight="8">
        <Label text="Test Connection" color="white" fontSize="14" fontWeight="500" textAlignment="center"></Label>
      </GridLayout>
      <GridLayout col="1" (tap)="resetApiConfig()" backgroundColor="#ff9800" borderRadius="8" padding="12" marginLeft="8">
        <Label text="Reset to Default" color="white" fontSize="14" fontWeight="500" textAlignment="center"></Label>
      </GridLayout>
    </GridLayout>

<GridLayout col="0" colSpan="2" (tap)="clearAllCache()" backgroundColor="#dc3545" borderRadius="8" padding="12" marginTop="15">
  <Label text="Clear All Cache" color="white" fontSize="14" fontWeight="500" textAlignment="center"></Label>
</GridLayout>



    <Label text="Note: Changes to API configuration require app restart" fontSize="10" color="#999" textAlignment="center"></Label>

  </StackLayout>
</ScrollView>
