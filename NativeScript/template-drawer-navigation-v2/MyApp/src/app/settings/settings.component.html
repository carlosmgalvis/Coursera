<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>
  <GridLayout columns="50, *">
    <Label class="action-bar-title" text="Settings" colSpan="2"></Label>
    <Label class="fas" text="&#xf0c9;" (tap)="onDrawerButtonTap()"></Label>
  </GridLayout>
</ActionBar>

<ScrollView>
  <StackLayout class="settings-menu" padding="20">

    <!-- Option 1: General Information -->
    <GridLayout class="menu-option" (tap)="goToGeneralInfo()" marginBottom="15" backgroundColor="white" borderRadius="12" padding="20" elevation="2">
      <StackLayout>
        <GridLayout columns="auto, *">
          <Label col="0" text="ℹ️" fontSize="32" marginRight="15" verticalAlignment="center"></Label>
          <StackLayout col="1">
            <Label text="General Information" fontSize="18" fontWeight="700" class="text-primary"></Label>
            <Label text="View your account information" fontSize="13" class="text-secondary" marginTop="4" textWrap="true"></Label>
          </StackLayout>
        </GridLayout>
      </StackLayout>
    </GridLayout>

    <!-- Option 2: User Information -->
    <GridLayout class="menu-option" (tap)="goToUserProfile()" marginBottom="15" backgroundColor="white" borderRadius="12" padding="20" elevation="2">
      <StackLayout>
        <GridLayout columns="auto, *">
          <Label col="0" text="👤" fontSize="32" marginRight="15" verticalAlignment="center"></Label>
          <StackLayout col="1">
            <Label text="User Information" fontSize="18" fontWeight="700" class="text-primary"></Label>
            <Label text="Edit your profile, name, phone, password and photo" fontSize="13" class="text-secondary" marginTop="4" textWrap="true"></Label>
          </StackLayout>
        </GridLayout>
      </StackLayout>
    </GridLayout>

    <!-- Option 3: Advanced Settings -->
    <GridLayout class="menu-option" (tap)="goToAdvancedSettings()" marginBottom="15" backgroundColor="white" borderRadius="12" padding="20" elevation="2">
      <StackLayout>
        <GridLayout columns="auto, *">
          <Label col="0" text="⚙️" fontSize="32" marginRight="15" verticalAlignment="center"></Label>
          <StackLayout col="1">
            <Label text="Advanced Settings" fontSize="18" fontWeight="700" class="text-primary"></Label>
            <Label text="Configure API URL, ports, timeout, retry attempts" fontSize="13" class="text-secondary" marginTop="4" textWrap="true"></Label>
          </StackLayout>
        </GridLayout>
      </StackLayout>
    </GridLayout>

  </StackLayout>
</ScrollView>
