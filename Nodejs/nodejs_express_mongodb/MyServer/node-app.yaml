apiVersion: v1
kind: Service
metadata:
  name: node-app-service
spec:
  type: LoadBalancer
  selector:
    app: node-app
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-app
  template:
    metadata:
      labels:
        app: node-app
    spec:
      containers:
        - name: node-app
          image: node-mongo-k8s-bicicletas
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URI
              value: "mongodb://root:cmgalvis@mongodb-service:27017/bicicletasdb?authSource=admin"
