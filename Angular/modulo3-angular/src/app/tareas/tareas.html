<div class="container mt-5">
  <div class="card p-4">

    <h2>
      Sistema de tareas
    </h2>

    <div class="d-flex gap-2 mt-3">
      <input
        type="text"

        class="form-control"

        [(ngModel)]="nombre"

        placeholder="Nueva tarea"
      >

      <button
        class="btn btn-primary"

        (click)="agregar()"
      >
        Agregar
      </button>

    </div>
    <div class="mt-4">
      <div
        class="card p-3 mb-2"

        *ngFor="
          let tarea
          of tareas$ | async
        "
      >

        <div class="d-flex justify-content-between align-items-center">

  <span>
    {{ tarea.nombre }}
  </span>

  <span class="badge bg-primary">
    Tarea
  </span>

</div>
      </div>
    </div>
  </div>
</div>
