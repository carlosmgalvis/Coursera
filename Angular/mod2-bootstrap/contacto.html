
<nav aria-label="breadcrumb">
  <ol class="breadcrumb">
    <li class="breadcrumb-item"><a href="index.html">Inicio</a></li>
    <li class="breadcrumb-item active" aria-current="page">Contacto</li>
  </ol>
</nav>

<form class="p-4 border rounded shadow-sm">
  <div class="form-group">
    <label for="email">Correo Electrónico</label>
    <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com">
  </div>
  <div class="form-group">
    <label for="interes">Interés Principal</label>
    <select class="form-control" id="interes">
      <option>Hardware</option>
      <option>Suscripción de Software</option>
      <option>Consultoría</option>
    </select>
  </div>
  <div class="form-group">
    <label for="mensaje">Mensaje o Comentario</label>
    <textarea class="form-control" id="mensaje" rows="4"></textarea>
  </div>
  <div class="form-group form-check">
    <input type="checkbox" class="form-check-input" id="check">
    <label class="form-check-label" for="check">Suscribirse al boletín de noticias</label>
  </div>
  <button type="submit" class="btn btn-primary btn-block">Enviar Mensaje</button>
</form>
